[package]
name = "archforge"
description = "ArchForge : éditeur de la base de données d'ArchCore (émulateur ArchLord), sur le modèle de Keira3"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
authors = ["BlaMacfly"]
license = "GPL-3.0-or-later"
repository = "https://github.com/BlaMacfly/ArchForge"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
mysql = { version = "28", default-features = false, features = ["minimal"] }
png = "0.18"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"

[dev-dependencies]
egui_kittest = "0.37"
