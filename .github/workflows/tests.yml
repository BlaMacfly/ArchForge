name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Bibliothèques de la fenêtre (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Serveur (Rust)
        run: cargo test
      - name: Générateur SQL (JavaScript)
        run: node --test tests/sql.test.mjs
