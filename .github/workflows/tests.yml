name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Bibliothèques de l'interface (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libxkbcommon-dev libfontconfig1-dev
      - name: Tests (SQL, moteur, définitions, interface)
        run: cargo test
